​name: verbal-desktop-app-pipeline

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"  # Production: trigger on version tags
      - "desk-prod-v*.*.*"  # Production: trigger on desktop production version tags
    branches:
      - 'release/**'  # Staging: trigger on release branches
      - develop  # Development: trigger on develop branch
    paths:
      - 'front/**'
      - '.github/workflows/verbal-desktop-app-pipeline.yaml'

env:
  TARGET_BUCKET_NAME: verbal-desktop-app-artifacts
  ZONE: us-west-2

jobs:
  setup:
    name: Determine Environment Configuration
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      gke_cluster_name: ${{ steps.set-env.outputs.gke_cluster_name }}
      namespace: ${{ steps.set-env.outputs.namespace }}
      gcp_project_id: ${{ steps.set-env.outputs.gcp_project_id }}
      service_account_secret: ${{ steps.set-env.outputs.service_account_secret }}
    steps:
      - name: Determine environment from trigger
        id: set-env
        run: |
          # Check if triggered by a tag (production)
          if [[ "${{ github.ref }}" == refs/tags/v*.*.* ]] || [[ "${{ github.ref }}" == refs/tags/desk-prod-v*.*.* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "gke_cluster_name=duploinfra-prod01" >> $GITHUB_OUTPUT
            echo "namespace=duploservices-app" >> $GITHUB_OUTPUT
            echo "gcp_project_id=duplo-prod-439614" >> $GITHUB_OUTPUT
            echo "service_account_secret=GCP_PROD_SERVICE_ACCOUNT_KEY_BASE64" >> $GITHUB_OUTPUT
          # Check if triggered by release/** branch (staging)
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "gke_cluster_name=duploinfra-nonprod01" >> $GITHUB_OUTPUT
            echo "namespace=duploservices-staging" >> $GITHUB_OUTPUT
            echo "gcp_project_id=duplo-non-prod-434116" >> $GITHUB_OUTPUT
            echo "service_account_secret=GCP_SERVICE_ACCOUNT_KEY_BASE64" >> $GITHUB_OUTPUT
          # Check if triggered by develop branch (development)
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "gke_cluster_name=duploinfra-nonprod01" >> $GITHUB_OUTPUT
            echo "namespace=duploservices-dev01" >> $GITHUB_OUTPUT
            echo "gcp_project_id=duplo-non-prod-434116" >> $GITHUB_OUTPUT
            echo "service_account_secret=GCP_SERVICE_ACCOUNT_KEY_BASE64" >> $GITHUB_OUTPUT
          else
            echo "Unknown trigger: ${{ github.ref }}"
            exit 1
          fi

